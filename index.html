<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Malar Goat Management System</title>
  <meta name="theme-color" content="#1F4D3A">
  <meta name="description" content="Goat, spending, sales, health and farm visit management for Malar Goat Farm.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div id="login" class="login" hidden>
    <div class="login-art">
      <div class="big-tag" aria-hidden="true"><b>MG</b><span id="loginFarm">Malar Goat Farm</span></div>
      <p>Every goat, every rupee and every farm visit in one place.</p>
    </div>
    <form class="login-form" id="loginForm" autocomplete="on">
      <h1>Welcome back</h1>
      <p class="muted">Sign in to look after the farm.</p>
      <label class="field">Username
        <input name="u" autocomplete="username" required autocapitalize="none">
      </label>
      <label class="field">Password
        <span class="pw">
          <input name="p" type="password" autocomplete="current-password" required>
          <button type="button" id="pwToggle">Show</button>
        </span>
      </label>
      <label class="check"><input type="checkbox" name="keep" checked> Keep me signed in on this device</label>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
      <p class="hint" id="loginHint">First time? Username <b>malar</b> and password <b>malar123</b>. Change them in Settings.</p>
    </form>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">MG</div>
        <div><strong id="brandName">Malar Goat Farm</strong><span>Management system</span></div>
      </div>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <button class="nav-item" data-action="logout" id="logoutBtn"></button>
    </aside>
    <div class="scrim" data-action="closeNav"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="openNav" aria-label="Open menu" id="menuBtn"></button>
        <h1 id="pageTitle">Dashboard</h1>
        <button class="btn btn-ghost btn-sm" data-action="exportAll" id="topExcel"></button>
      </header>
      <div id="view" class="view"></div>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Quick"></nav>
  </div>

  <div id="modal" class="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
